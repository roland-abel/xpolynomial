name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }} (C++23)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
            cxxflags: ""
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cxxflags: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev ${{ matrix.packages }}

      - name: Build and install GoogleTest
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest-build \
                -DBUILD_GMOCK=OFF -DCMAKE_INSTALL_PREFIX=/tmp/gtest -G Ninja
          cmake --build /tmp/gtest-build
          cmake --install /tmp/gtest-build

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: -Wall -Wextra -Wpedantic -Werror ${{ matrix.cxxflags }}
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/gtest

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: GCC 14 (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev g++-14

      - name: Build and install GoogleTest
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest-build \
                -DBUILD_GMOCK=OFF -DCMAKE_INSTALL_PREFIX=/tmp/gtest -G Ninja
          cmake --build /tmp/gtest-build
          cmake --install /tmp/gtest-build

      - name: Configure
        env:
          CXX: g++-14
          CXXFLAGS: -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/gtest

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: GCC 14 (coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev g++-14 lcov

      - name: Build and install GoogleTest
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest-build \
                -DBUILD_GMOCK=OFF -DCMAKE_INSTALL_PREFIX=/tmp/gtest -G Ninja
          cmake --build /tmp/gtest-build
          cmake --install /tmp/gtest-build

      - name: Configure
        env:
          CXX: g++-14
          CXXFLAGS: --coverage -g -O0
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/gtest

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --gcov-tool gcov-14 --ignore-errors mismatch,gcov,source
          lcov --remove coverage.info '/usr/*' '/tmp/*' '*/test/*' --output-file coverage.info --ignore-errors mismatch,unused,empty
          lcov --list coverage.info --ignore-errors mismatch,unused,empty

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info

  msvc:
    name: MSVC (C++23)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GoogleTest
        run: vcpkg install gtest:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_CXX_FLAGS="/W4"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
